services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code2k8s
    ports: ["55432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
volumes:
  pg: {}
