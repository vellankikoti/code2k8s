# Amazon EKS.
# Prereqs:
#   - AWS Load Balancer Controller installed (creates ALBs from Ingress)
#     https://kubernetes-sigs.github.io/aws-load-balancer-controller/
#   - cert-manager + ClusterIssuer 'letsencrypt-prod' (or use AWS ACM via
#     the alb.ingress.kubernetes.io/certificate-arn annotation instead)
#   - EBS CSI driver (default on EKS >= 1.24; otherwise install it)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
    target: { kind: Ingress, name: web }
  - patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
    target: { kind: StatefulSet, name: postgres }
  - patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
    target: { kind: StatefulSet, name: redis }
