# killercoda (free in-browser k8s playground: killercoda.com).
# Killercoda exposes NodePorts via its "Traffic" tab — no public DNS, no LB.
# We patch the base Service to NodePort 30080 and delete the base Ingress.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
    target: { kind: Service, name: web }
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: web
        namespace: app
    target: { kind: Ingress, name: web }
