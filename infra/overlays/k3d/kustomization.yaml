# Local k3d cluster (what we run in CI + on a laptop).
# Traefik ingress (k3s default). local-path storage (k3s default). No TLS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
    target: { kind: Ingress, name: web }
