apiVersion: v1
kind: ServiceAccount
metadata:
  name: code2k8s-api
  namespace: code2k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code2k8s-api
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods", "pods/log", "pods/proxy", "events", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code2k8s-api
subjects:
  - kind: ServiceAccount
    name: code2k8s-api
    namespace: code2k8s
roleRef:
  kind: ClusterRole
  name: code2k8s-api
  apiGroup: rbac.authorization.k8s.io
