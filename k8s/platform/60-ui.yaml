apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: code2k8s
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      containers:
        - name: ui
          image: ghcr.io/yourorg/code2k8s-ui:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: API_URL, value: "http://api.code2k8s.svc.cluster.local" }
          readinessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: code2k8s
spec:
  selector: { app: ui }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code2k8s
  namespace: code2k8s
spec:
  rules:
    - host: code2k8s.apps.local
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /,    pathType: Prefix, backend: { service: { name: ui,  port: { number: 80 } } } }
